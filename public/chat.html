<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>LawnLink Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:system-ui;
background:#f4f4f4;
height:100vh;
display:flex;
flex-direction:column;
}

.header{
background:#39d353;
color:white;
padding:20px;
font-size:32px;
font-weight:700;
text-align:center;
box-shadow:0 4px 12px rgba(0,0,0,.1);
}

.status{
text-align:center;
padding:10px;
font-size:14px;
color:#666;
background:white;
border-bottom:1px solid #eee;
}

#messages{
flex:1;
overflow-y:auto;
padding:20px;
display:flex;
flex-direction:column;
gap:12px;
}

.message{
background:white;
padding:14px;
border-radius:14px;
max-width:80%;
box-shadow:0 4px 12px rgba(0,0,0,.08);
font-size:16px;
word-wrap:break-word;
}

.mine{
align-self:flex-end;
background:#39d353;
color:white;
}

.bottom{
display:flex;
padding:16px;
background:white;
border-top:1px solid #ddd;
gap:10px;
}

input{
flex:1;
padding:16px;
border-radius:14px;
border:1px solid #ccc;
font-size:16px;
outline:none;
}

button{
padding:16px 22px;
border:none;
border-radius:14px;
background:#39d353;
color:white;
font-size:16px;
font-weight:700;
cursor:pointer;
}

button:hover{
opacity:.9;
}

</style>

</head>

<body>

<div class="header">
💬 LawnLink Chat
</div>

<div class="status">
Live messaging connected
</div>

<div id="messages"></div>

<div class="bottom">

<input
id="messageInput"
placeholder="Type a message..."
/>

<button id="sendBtn">
Send
</button>

</div>

<script>

const SUPABASE_URL =
"https://zapztkpavvtslvmjzxbh.supabase.co"

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InphcHp0a3BhdnZ0c2x2bWp6eGJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0Mjg2MzQsImV4cCI6MjA4OTAwNDYzNH0.81y2QP0GKLQJBkgjZkrjEhfEV_2OhJxaxpK1NfwDHRg"

const client = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
)

const messagesDiv =
document.getElementById("messages")

const input =
document.getElementById("messageInput")

const sendBtn =
document.getElementById("sendBtn")

const username =
"User-" + Math.floor(Math.random() * 9999)

function addMessage(message,isMine=false){

const div=document.createElement("div")

div.className =
isMine
? "message mine"
: "message"

div.innerHTML = `
<strong>${message.username}</strong><br>
${message.text}
`

messagesDiv.appendChild(div)

messagesDiv.scrollTop =
messagesDiv.scrollHeight

}

async function loadMessages(){

const { data,error } =
await client
.from("messages")
.select("*")
.order("created_at",{ ascending:true })

if(error){
console.error(error)
return
}

messagesDiv.innerHTML = ""

data.forEach(msg => {

addMessage(
msg,
msg.username === username
)

})

}

async function sendMessage(){

const text = input.value.trim()

if(!text) return

const { error } =
await client
.from("messages")
.insert([
{
username:username,
text:text
}
])

if(error){
console.error(error)
alert(error.message)
return
}

input.value=""

}

sendBtn.addEventListener(
"click",
sendMessage
)

input.addEventListener(
"keypress",
(e)=>{
if(e.key==="Enter"){
sendMessage()
}
}
)

client
.channel("chat-room")
.on(
"postgres_changes",
{
event:"INSERT",
schema:"public",
table:"messages"
},
(payload)=>{

addMessage(
payload.new,
payload.new.username === username
)

}
)
.subscribe()

loadMessages()

</script>

</body>
</html>
