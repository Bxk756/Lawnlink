<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LawnLink Live Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
margin:0;
font-family:system-ui;
background:#f4f6f8;
display:flex;
flex-direction:column;
height:100vh;
}

header{
background:#16a34a;
color:white;
padding:18px;
font-size:22px;
font-weight:bold;
text-align:center;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

#messages{
flex:1;
overflow-y:auto;
padding:20px;
display:flex;
flex-direction:column;
gap:12px;
}

.message{
max-width:75%;
padding:14px;
border-radius:18px;
font-size:15px;
line-height:1.5;
word-wrap:break-word;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.sent{
align-self:flex-end;
background:#16a34a;
color:white;
border-bottom-right-radius:6px;
}

.received{
align-self:flex-start;
background:white;
color:#111827;
border-bottom-left-radius:6px;
}

.footer{
display:flex;
padding:15px;
background:white;
border-top:1px solid #e5e7eb;
gap:10px;
}

input{
flex:1;
padding:14px;
border-radius:12px;
border:1px solid #d1d5db;
font-size:16px;
outline:none;
}

button{
padding:14px 20px;
border:none;
background:#16a34a;
color:white;
border-radius:12px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.status{
text-align:center;
padding:10px;
font-size:13px;
color:#6b7280;
background:#f9fafb;
}

</style>

</head>

<body>

<header>
💬 LawnLink Chat
</header>

<div class="status">
Live messaging connected
</div>

<div id="messages"></div>

<div class="footer">

<input
id="messageInput"
placeholder="Type a message..."
autocomplete="off"
/>

<button onclick="sendMessage()">
Send
</button>

</div>

<script>

const SUPABASE_URL =
"https://zapztkpavvtslvmjzxbh.supabase.co"

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InphcHp0a3BhdnZ0c2x2bWp6eGJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0Mjg2MzQsImV4cCI6MjA4OTAwNDYzNH0.81y2QP0GKLQJBkgjZkrjEhfEV_2OhJxaxpK1NfwDHRg"

const supabase = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
)

const messagesDiv =
document.getElementById("messages")

const currentUser = "customer"

async function loadMessages(){

const { data, error } = await supabase
.from("messages")
.select("*")
.order("created_at",{ ascending:true })

if(error){

console.error(error)

return

}

messagesDiv.innerHTML = ""

data.forEach(msg=>{

addMessage(msg)

})

scrollBottom()

}

function addMessage(msg){

const div = document.createElement("div")

div.className =
msg.sender === currentUser
? "message sent"
: "message received"

div.innerText = msg.message

messagesDiv.appendChild(div)

}

async function sendMessage(){

const input =
document.getElementById("messageInput")

const text = input.value.trim()

if(!text) return

const { error } = await supabase
.from("messages")
.insert([
{
sender: currentUser,
message: text
}
])

if(error){

console.error(error)

return

}

input.value = ""

}

function scrollBottom(){

messagesDiv.scrollTop =
messagesDiv.scrollHeight

}

supabase
.channel("chat-room")
.on(
"postgres_changes",
{
event:"INSERT",
schema:"public",
table:"messages"
},
(payload)=>{

addMessage(payload.new)

scrollBottom()

}
)
.subscribe()

loadMessages()

</script>

</body>
</html>
