<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>LawnLink Job Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:system-ui;
background:#f4f4f4;
height:100vh;
display:flex;
flex-direction:column;
}

.header{
background:#39d353;
color:white;
padding:20px;
font-size:28px;
font-weight:700;
text-align:center;
box-shadow:0 4px 12px rgba(0,0,0,.1);
}

.jobBar{
background:white;
padding:12px;
text-align:center;
font-size:15px;
border-bottom:1px solid #ddd;
color:#555;
}

#messages{
flex:1;
overflow-y:auto;
padding:20px;
display:flex;
flex-direction:column;
gap:12px;
}

.message{
background:white;
padding:14px;
border-radius:14px;
max-width:80%;
box-shadow:0 4px 12px rgba(0,0,0,.08);
font-size:16px;
word-wrap:break-word;
}

.mine{
align-self:flex-end;
background:#39d353;
color:white;
}

.chat-image{
width:100%;
border-radius:14px;
margin-top:10px;
max-height:400px;
object-fit:cover;
}

.bottom{
display:flex;
padding:16px;
background:white;
border-top:1px solid #ddd;
gap:10px;
}

input[type="text"]{
flex:1;
padding:16px;
border-radius:14px;
border:1px solid #ccc;
font-size:16px;
outline:none;
}

button{
padding:16px 22px;
border:none;
border-radius:14px;
background:#39d353;
color:white;
font-size:16px;
font-weight:700;
cursor:pointer;
}

button:hover{
opacity:.9;
}

#imageInput{
display:none;
}

.uploadBtn{
background:#222;
}

</style>

</head>

<body>

<div class="header">
💬 LawnLink Job Chat
</div>

<div class="jobBar" id="jobInfo">
Loading job room...
</div>

<div id="messages"></div>

<div class="bottom">

<input
type="text"
id="messageInput"
placeholder="Type a message..."
/>

<input
type="file"
id="imageInput"
accept="image/*"
/>

<button
class="uploadBtn"
id="imageBtn"
>
📷
</button>

<button id="sendBtn">
Send
</button>

</div>

<script>

const SUPABASE_URL =
"https://zapztkpavvtslvmjzxbh.supabase.co"

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InphcHp0a3BhdnZ0c2x2bWp6eGJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0Mjg2MzQsImV4cCI6MjA4OTAwNDYzNH0.81y2QP0GKLQJBkgjZkrjEhfEV_2OhJxaxpK1NfwDHRg"

const client =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
)

const params =
new URLSearchParams(window.location.search)

const jobId =
params.get("job")

if(!jobId){

alert("Missing job ID")

throw new Error("No job ID")

}

document.getElementById("jobInfo").innerText =
"Private room for Job #" + jobId

const username =
localStorage.getItem("chatUser")
||
("User-" + Math.floor(Math.random()*9999))

localStorage.setItem(
"chatUser",
username
)

const messagesDiv =
document.getElementById("messages")

const input =
document.getElementById("messageInput")

const sendBtn =
document.getElementById("sendBtn")

const imageBtn =
document.getElementById("imageBtn")

const imageInput =
document.getElementById("imageInput")

function addMessage(message,isMine=false){

const div =
document.createElement("div")

div.className =
isMine
? "message mine"
: "message"

let imageHTML = ""

if(message.image_url){

imageHTML = `
<img
src="${message.image_url}"
class="chat-image"
/>
`

}

div.innerHTML = `
<strong>${message.username}</strong><br><br>

${message.text || ""}

${imageHTML}
`

messagesDiv.appendChild(div)

messagesDiv.scrollTop =
messagesDiv.scrollHeight

}

async function loadMessages(){

const { data,error } =
await client
.from("messages")
.select("*")
.eq("job_id",jobId)
.order("created_at",{ ascending:true })

if(error){

console.error(error)

return

}

messagesDiv.innerHTML = ""

data.forEach(msg => {

addMessage(
msg,
msg.username === username
)

})

}

async function sendMessage(){

const text =
input.value.trim()

if(!text) return

const { error } =
await client
.from("messages")
.insert([
{
job_id:jobId,
username:username,
text:text
}
])

if(error){

console.error(error)

alert(error.message)

return

}

input.value=""

}

async function uploadImage(file){

const fileName =
Date.now() + "-" + file.name

const { error: uploadError } =
await client.storage
.from("job-images")
.upload(fileName,file)

if(uploadError){

console.error(uploadError)

alert(uploadError.message)

return

}

const { data } =
client.storage
.from("job-images")
.getPublicUrl(fileName)

const imageUrl =
data.publicUrl

const { error } =
await client
.from("messages")
.insert([
{
job_id:jobId,
username:username,
image_url:imageUrl
}
])

if(error){

console.error(error)

alert(error.message)

}

}

sendBtn.addEventListener(
"click",
sendMessage
)

input.addEventListener(
"keypress",
(e)=>{

if(e.key==="Enter"){

sendMessage()

}

})

imageBtn.addEventListener(
"click",
()=>{

imageInput.click()

}
)

imageInput.addEventListener(
"change",
async (e)=>{

const file =
e.target.files[0]

if(!file) return

uploadImage(file)

}
)

client
.channel("job-chat-" + jobId)
.on(
"postgres_changes",
{
event:"INSERT",
schema:"public",
table:"messages"
},
(payload)=>{

if(
String(payload.new.job_id)
!== String(jobId)
) return

addMessage(
payload.new,
payload.new.username === username
)

}
)
.subscribe()

loadMessages()

</script>

</body>
</html>
