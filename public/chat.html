<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>LawnLink Voice Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:system-ui;
background:#f4f4f4;
height:100vh;
display:flex;
flex-direction:column;
}

.header{
background:#39d353;
color:white;
padding:18px;
font-size:26px;
font-weight:700;
text-align:center;
box-shadow:0 4px 12px rgba(0,0,0,.1);
}

.topBar{
background:white;
padding:10px 16px;
border-bottom:1px solid #ddd;
}

.roomTitle{
font-size:15px;
color:#444;
}

.onlineStatus{
font-size:13px;
color:#16a34a;
margin-top:4px;
font-weight:600;
}

.typingBar{
height:28px;
padding:6px 16px;
font-size:14px;
color:#666;
background:#fafafa;
border-bottom:1px solid #eee;
font-style:italic;
}

#messages{
flex:1;
overflow-y:auto;
padding:20px;
display:flex;
flex-direction:column;
gap:12px;
}

.message{
background:white;
padding:14px;
border-radius:14px;
max-width:80%;
box-shadow:0 4px 12px rgba(0,0,0,.08);
font-size:16px;
word-wrap:break-word;
}

.mine{
align-self:flex-end;
background:#39d353;
color:white;
}

.chat-image{
width:100%;
border-radius:14px;
margin-top:10px;
max-height:400px;
object-fit:cover;
}

.voice{
margin-top:10px;
width:100%;
}

.meta{
margin-top:8px;
font-size:12px;
opacity:.8;
text-align:right;
}

.bottom{
display:flex;
padding:16px;
background:white;
border-top:1px solid #ddd;
gap:10px;
}

input[type="text"]{
flex:1;
padding:16px;
border-radius:14px;
border:1px solid #ccc;
font-size:16px;
outline:none;
}

button{
padding:16px 18px;
border:none;
border-radius:14px;
background:#39d353;
color:white;
font-size:16px;
font-weight:700;
cursor:pointer;
}

#imageInput{
display:none;
}

.uploadBtn{
background:#222;
}

.voiceBtn{
background:#2563eb;
}

.recording{
background:#dc2626 !important;
}

</style>

</head>

<body>

<div class="header">
🎙️ LawnLink Voice Chat
</div>

<div class="topBar">

<div
class="roomTitle"
id="jobInfo"
>
Loading room...
</div>

<div
class="onlineStatus"
id="onlineStatus"
>
Connecting...
</div>

</div>

<div
class="typingBar"
id="typingBar"
></div>

<div id="messages"></div>

<div class="bottom">

<input
type="text"
id="messageInput"
placeholder="Type a message..."
/>

<input
type="file"
id="imageInput"
accept="image/*"
/>

<button
class="uploadBtn"
id="imageBtn"
>
📷
</button>

<button
class="voiceBtn"
id="voiceBtn"
>
🎤
</button>

<button id="sendBtn">
Send
</button>

</div>

<script>

const SUPABASE_URL =
"https://zapztkpavvtslvmjzxbh.supabase.co"

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInR5cCI6IkpXVCJ9"

const client =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
)

const params =
new URLSearchParams(window.location.search)

const jobId =
params.get("job")

if(!jobId){

alert("Missing job ID")

throw new Error("No job ID")

}

document.getElementById("jobInfo").innerText =
"Private room for Job #" + jobId

const username =
localStorage.getItem("chatUser")
||
("User-" + Math.floor(Math.random()*9999))

localStorage.setItem(
"chatUser",
username
)

const messagesDiv =
document.getElementById("messages")

const input =
document.getElementById("messageInput")

const sendBtn =
document.getElementById("sendBtn")

const imageBtn =
document.getElementById("imageBtn")

const imageInput =
document.getElementById("imageInput")

const typingBar =
document.getElementById("typingBar")

const onlineStatus =
document.getElementById("onlineStatus")

const voiceBtn =
document.getElementById("voiceBtn")

let typingTimeout = null

let mediaRecorder = null
let audioChunks = []

function addMessage(message,isMine=false){

const div =
document.createElement("div")

div.className =
isMine
? "message mine"
: "message"

let imageHTML = ""

if(message.image_url){

imageHTML = `
<img
src="${message.image_url}"
class="chat-image"
/>
`

}

let voiceHTML = ""

if(message.voice_url){

voiceHTML = `
<audio
controls
class="voice"
src="${message.voice_url}">
</audio>
`

}

div.innerHTML = `
<strong>${message.username}</strong><br><br>

${message.text || ""}

${imageHTML}

${voiceHTML}

<div class="meta">

${message.seen ? "Seen ✓✓" : "Delivered ✓"}

</div>
`

messagesDiv.appendChild(div)

messagesDiv.scrollTop =
messagesDiv.scrollHeight

}

async function loadMessages(){

const { data,error } =
await client
.from("messages")
.select("*")
.eq("job_id",jobId)
.order("created_at",{ ascending:true })

if(error){

console.error(error)

return

}

messagesDiv.innerHTML = ""

data.forEach(msg => {

addMessage(
msg,
msg.username === username
)

})

}

async function sendMessage(){

const text =
input.value.trim()

if(!text) return

await client
.from("messages")
.insert([
{
job_id:jobId,
username:username,
text:text,
seen:false
}
])

input.value=""

}

async function uploadVoice(blob){

const fileName =
Date.now() + ".webm"

const { error: uploadError } =
await client.storage
.from("job-images")
.upload(fileName,blob)

if(uploadError){

alert(uploadError.message)

return

}

const { data } =
client.storage
.from("job-images")
.getPublicUrl(fileName)

await client
.from("messages")
.insert([
{
job_id:jobId,
username:username,
voice_url:data.publicUrl,
seen:false
}
])

}

async function startRecording(){

const stream =
await navigator.mediaDevices.getUserMedia({
audio:true
})

mediaRecorder =
new MediaRecorder(stream)

audioChunks = []

mediaRecorder.ondataavailable =
(event)=>{

audioChunks.push(event.data)

}

mediaRecorder.onstop =
async ()=>{

const audioBlob =
new Blob(audioChunks,{
type:"audio/webm"
})

uploadVoice(audioBlob)

}

mediaRecorder.start()

voiceBtn.classList.add(
"recording"
)

voiceBtn.innerText = "⏹️"

}

function stopRecording(){

mediaRecorder.stop()

voiceBtn.classList.remove(
"recording"
)

voiceBtn.innerText = "🎤"

}

voiceBtn.addEventListener(
"click",
async ()=>{

if(
!mediaRecorder
||
mediaRecorder.state === "inactive"
){

startRecording()

}else{

stopRecording()

}

}
)

sendBtn.addEventListener(
"click",
sendMessage
)

input.addEventListener(
"keypress",
(e)=>{

if(e.key==="Enter"){

sendMessage()

}

})

client
.channel("job-chat-" + jobId)
.on(
"postgres_changes",
{
event:"INSERT",
schema:"public",
table:"messages"
},
(payload)=>{

if(
String(payload.new.job_id)
!== String(jobId)
) return

addMessage(
payload.new,
payload.new.username === username
)

}
)
.subscribe()

loadMessages()

</script>

</body>
</html>
