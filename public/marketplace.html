<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>LawnLink Marketplace</title>

<meta
name="description"
content="Find nearby landscaping jobs on LawnLink."
>

<link
href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
rel="stylesheet"
/>

<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

header{
background:#1db954;
color:white;
padding:18px;
font-size:22px;
font-weight:bold;
display:flex;
justify-content:space-between;
align-items:center;
}

#map{
height:250px;
}

.container{
padding:12px;
padding-bottom:120px;
}

.job{
background:white;
padding:16px;
border-radius:16px;
margin-bottom:14px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
cursor:pointer;
}

.price{
font-size:20px;
font-weight:bold;
color:#1db954;
}

.distance{
font-size:13px;
color:#555;
}

.bottom-bar{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
padding:14px;
box-shadow:0 -2px 10px rgba(0,0,0,.1);
display:none;
z-index:999;
}

.bottom-bar.active{
display:block;
}

.bottom-bar button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.accept{
background:#1db954;
color:white;
}

.navigate{
background:black;
color:white;
}

.empty{
text-align:center;
padding:40px;
color:#555;
}

</style>

</head>

<body>

<header>

<span>Jobs Near You</span>

<span onclick="logout()" style="cursor:pointer;">
Logout
</span>

</header>

<main>

<div id="map"></div>

<div class="container" id="jobs">

<div class="empty">
Loading jobs...
</div>

</div>

</main>

<div class="bottom-bar" id="bottomBar">

<h3 id="selectedTitle"></h3>

<p id="selectedPrice"></p>

<button
class="accept"
onclick="acceptSelected()"
>
Accept Job
</button>

<button
class="navigate"
onclick="navigateSelected()"
>
📍 Navigate
</button>

</div>

<script>

mapboxgl.accessToken =
"pk.eyJ1IjoiYnhrNzU3IiwiYSI6ImNtbnFzZzhzMzBhYWgyc3EzaWRteHgzanMifQ.0SxZfEeRvKHEuSxnF4dq9A"

const SUPABASE_URL =
"https://zapztkpavvtslvmjzxbh.supabase.co"

const SUPABASE_ANON_KEY =
"YOUR_ANON_KEY"

const { createClient } = supabase

const client =
createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
)

let currentUser = null
let userLat
let userLng
let map
let selectedJob = null

async function checkUser(){

const { data } =
await client.auth.getUser()

if(!data.user){

window.location.href="/login.html"
return

}

currentUser = data.user

}

navigator.geolocation.getCurrentPosition(

async(pos)=>{

await checkUser()

userLat = pos.coords.latitude
userLng = pos.coords.longitude

initMap()
loadJobs()
setupRealtime()

}

)

function initMap(){

map = new mapboxgl.Map({

container:"map",
style:"mapbox://styles/mapbox/streets-v11",
center:[userLng,userLat],
zoom:12

})

new mapboxgl.Marker({
color:"blue"
})
.setLngLat([userLng,userLat])
.addTo(map)

}

function getDistance(lat1, lon1, lat2, lon2){

const R = 6371

const dLat =
(lat2-lat1) * Math.PI/180

const dLon =
(lon2-lon1) * Math.PI/180

const a =
Math.sin(dLat/2)**2 +
Math.cos(lat1*Math.PI/180) *
Math.cos(lat2*Math.PI/180) *
Math.sin(dLon/2)**2

const c =
2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))

return (R*c).toFixed(2)

}

async function loadJobs(){

const res =
await fetch("/api/jobs")

const jobs =
await res.json()

const container =
document.getElementById("jobs")

container.innerHTML = ""

const openJobs =
jobs.filter(
job => job.status === "open"
)

if(openJobs.length === 0){

container.innerHTML = `
<div class="empty">
No open jobs nearby
</div>
`

return

}

openJobs.forEach(job=>{

const distance =
job.lat
? getDistance(
userLat,
userLng,
job.lat,
job.lng
)
: null

const div =
document.createElement("div")

div.className = "job"

div.onclick = ()=>selectJob(job)

div.innerHTML = `

<h3>${job.title}</h3>

<p class="price">
$${job.price}
</p>

${distance
? `<p class="distance">${distance} km away</p>`
: ""}

`

container.appendChild(div)

})

}

// 🚀 REALTIME

function setupRealtime(){

client
.channel("jobs-realtime")

.on(
"postgres_changes",
{
event:"*",
schema:"public",
table:"jobs"
},
(payload)=>{

console.log("REALTIME:", payload)

loadJobs()

}
)

.subscribe()

}

function selectJob(job){

selectedJob = job

document.getElementById("selectedTitle")
.innerText = job.title

document.getElementById("selectedPrice")
.innerText = "$" + job.price

document.getElementById("bottomBar")
.classList.add("active")

}

function acceptSelected(){

if(!selectedJob)return

acceptJob(selectedJob.id)

}

function navigateSelected(){

if(!selectedJob)return

openDirections(
selectedJob.lat,
selectedJob.lng
)

}

function openDirections(lat,lng){

const isIOS =
/iPhone|iPad|iPod/i
.test(navigator.userAgent)

if(isIOS){

window.open(
`http://maps.apple.com/?daddr=${lat},${lng}`,
"_blank"
)

}else{

window.open(
`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`,
"_blank"
)

}

}

async function acceptJob(jobId){

const res =
await fetch("/api/accept-job",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

jobId,
landscaperId: currentUser.id

})

})

const data =
await res.json()

if(!data.success){

alert(data.error || "Failed")
return

}

alert("Job accepted!")

window.location.href="/my-jobs.html"

}

async function logout(){

await client.auth.signOut()

window.location.href="/login.html"

}

</script>

</body>
</html>
