<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>LawnLink AI Estimator</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:system-ui;
background:#f4f4f4;
min-height:100vh;
display:flex;
flex-direction:column;
}

.header{
background:#39d353;
padding:24px;
text-align:center;
color:white;
box-shadow:0 4px 14px rgba(0,0,0,.1);
}

.header h1{
font-size:42px;
font-weight:800;
margin-bottom:6px;
}

.header p{
font-size:17px;
opacity:.95;
}

.container{
width:100%;
max-width:1100px;
margin:auto;
padding:30px 20px 60px;
}

.card{
background:white;
border-radius:24px;
padding:30px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
margin-bottom:25px;
}

.uploadBox{
border:3px dashed #39d353;
border-radius:20px;
padding:40px;
text-align:center;
cursor:pointer;
background:white;
transition:.2s;
width:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
min-height:220px;
overflow:hidden;
position:relative;
}

.uploadBox:hover{
background:#f7fff8;
}

.uploadBox img{
max-width:100%;
max-height:400px;
border-radius:16px;
object-fit:cover;
margin-top:15px;
}

.uploadTitle{
font-size:36px;
font-weight:800;
margin-bottom:10px;
color:#222;
}

.uploadSub{
font-size:18px;
color:#666;
}

input[type="file"]{
position:absolute;
opacity:0;
pointer-events:none;
width:0;
height:0;
}

.analyzeBtn{
width:100%;
margin-top:25px;
padding:22px;
border:none;
border-radius:18px;
background:#39d353;
color:white;
font-size:24px;
font-weight:800;
cursor:pointer;
transition:.2s;
}

.analyzeBtn:hover{
transform:scale(1.01);
opacity:.95;
}

.results{
display:none;
margin-top:25px;
}

.resultGrid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.resultCard{
background:white;
padding:24px;
border-radius:20px;
box-shadow:0 8px 22px rgba(0,0,0,.08);
text-align:center;
}

.resultLabel{
font-size:16px;
color:#666;
margin-bottom:10px;
}

.resultValue{
font-size:34px;
font-weight:800;
color:#39d353;
}

.analysis{
margin-top:25px;
background:white;
padding:24px;
border-radius:20px;
box-shadow:0 8px 22px rgba(0,0,0,.08);
line-height:1.7;
font-size:18px;
color:#333;
}

.loading{
display:none;
margin-top:25px;
text-align:center;
}

.spinner{
width:90px;
height:90px;
border:10px solid #ddd;
border-top:10px solid #39d353;
border-radius:50%;
animation:spin 1s linear infinite;
margin:auto auto 25px;
}

.loadingText{
font-size:24px;
font-weight:700;
color:#444;
}

@keyframes spin{
0%{
transform:rotate(0deg);
}
100%{
transform:rotate(360deg);
}
}

.previewImage{
margin-top:20px;
max-width:100%;
border-radius:18px;
box-shadow:0 8px 24px rgba(0,0,0,.15);
}

@media(max-width:700px){

.header h1{
font-size:28px;
}

.uploadTitle{
font-size:26px;
}

.analyzeBtn{
font-size:20px;
padding:18px;
}

.resultValue{
font-size:28px;
}

}

</style>

</head>

<body>

<div class="header">

<h1>
🤖 LawnLink AI Estimator
</h1>

<p>
Upload a lawn photo and get instant AI-powered landscaping estimates
</p>

</div>

<div class="container">

<div class="card">

<label class="uploadBox" for="fileInput">

<div class="uploadTitle">
📸 Upload Lawn Photo
</div>

<div class="uploadSub">
Tap here to upload a lawn image
</div>

<img
id="preview"
class="previewImage"
style="display:none;"
/>

<input
type="file"
id="fileInput"
accept="image/*"
/>

</label>

<button
class="analyzeBtn"
id="analyzeBtn"
>
Analyze Lawn
</button>

<div
class="loading"
id="loading"
>

<div class="spinner"></div>

<div class="loadingText">
AI analyzing lawn...
</div>

</div>

<div
class="results"
id="results"
>

<div class="resultGrid">

<div class="resultCard">

<div class="resultLabel">
Estimated Price
</div>

<div
class="resultValue"
id="priceResult"
>
$0
</div>

</div>

<div class="resultCard">

<div class="resultLabel">
Estimated Size
</div>

<div
class="resultValue"
id="sizeResult"
>
0 sq ft
</div>

</div>

<div class="resultCard">

<div class="resultLabel">
Labor Hours
</div>

<div
class="resultValue"
id="laborResult"
>
0 hrs
</div>

</div>

<div class="resultCard">

<div class="resultLabel">
Difficulty
</div>

<div
class="resultValue"
id="difficultyResult"
>
Easy
</div>

</div>

</div>

<div
class="analysis"
id="analysisText"
>

</div>

</div>

</div>

</div>

<script>

const fileInput =
document.getElementById("fileInput")

const preview =
document.getElementById("preview")

const analyzeBtn =
document.getElementById("analyzeBtn")

const loading =
document.getElementById("loading")

const results =
document.getElementById("results")

const priceResult =
document.getElementById("priceResult")

const sizeResult =
document.getElementById("sizeResult")

const laborResult =
document.getElementById("laborResult")

const difficultyResult =
document.getElementById("difficultyResult")

const analysisText =
document.getElementById("analysisText")

let uploadedImage = null

fileInput.addEventListener(
"change",
(event)=>{

const file =
event.target.files[0]

if(!file) return

uploadedImage = file

const reader =
new FileReader()

reader.onload = (e)=>{

preview.src = e.target.result

preview.style.display = "block"

}

reader.readAsDataURL(file)

}
)

analyzeBtn.addEventListener(
"click",
()=>{

if(!uploadedImage){

alert("Please upload a lawn image first.")

return

}

results.style.display = "none"

loading.style.display = "block"

setTimeout(()=>{

loading.style.display = "none"

results.style.display = "block"

const estimatedPrice =
Math.floor(
Math.random()*400 + 120
)

const estimatedSize =
Math.floor(
Math.random()*5000 + 1500
)

const laborHours =
Math.floor(
Math.random()*8 + 2
)

const difficulties = [
"Easy",
"Medium",
"Hard"
]

const difficulty =
difficulties[
Math.floor(
Math.random()*difficulties.length
)
]

priceResult.innerText =
"$" + estimatedPrice

sizeResult.innerText =
estimatedSize + " sq ft"

laborResult.innerText =
laborHours + " hrs"

difficultyResult.innerText =
difficulty

analysisText.innerHTML = `
<b>AI Lawn Analysis Complete</b>
<br><br>

The uploaded property appears to have moderate grass density with visible edging requirements and trimming areas.

Recommended services include:
<ul style="margin-top:15px;padding-left:20px;">
<li>Lawn mowing</li>
<li>Edge trimming</li>
<li>Weed cleanup</li>
<li>Blower cleanup</li>
</ul>

<br>

Estimated project completion time:
<b>${laborHours} labor hours</b>

<br><br>

Suggested customer quote:
<b>$${estimatedPrice}</b>

<br><br>

Difficulty rating:
<b>${difficulty}</b>
`

},2500)

}
)

</script>

</body>

</html>
