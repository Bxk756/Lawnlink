<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>LawnLink Job Gallery</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:system-ui;
background:#f4f4f4;
min-height:100vh;
}

.header{
background:#39d353;
color:white;
padding:22px;
font-size:28px;
font-weight:700;
text-align:center;
box-shadow:0 4px 12px rgba(0,0,0,.1);
}

.jobBar{
background:white;
padding:14px;
text-align:center;
font-size:15px;
border-bottom:1px solid #ddd;
color:#555;
}

.uploadSection{
background:white;
padding:16px;
display:flex;
gap:12px;
position:sticky;
top:0;
z-index:10;
border-bottom:1px solid #ddd;
}

button{
padding:14px 18px;
border:none;
border-radius:12px;
background:#39d353;
color:white;
font-size:15px;
font-weight:700;
cursor:pointer;
}

.videoBtn{
background:#2563eb;
}

input{
display:none;
}

.gallery{
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
gap:18px;
}

.card{
background:white;
border-radius:18px;
overflow:hidden;
box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
display:block;
}

.card video{
width:100%;
height:220px;
object-fit:cover;
background:black;
}

.info{
padding:12px;
}

.username{
font-weight:700;
margin-bottom:6px;
}

.time{
font-size:12px;
color:#666;
}

.empty{
padding:50px;
text-align:center;
color:#666;
font-size:18px;
}

</style>

</head>

<body>

<div class="header">
📸 LawnLink Job Gallery
</div>

<div
class="jobBar"
id="jobInfo"
>
Loading gallery...
</div>

<div class="uploadSection">

<input
type="file"
id="photoInput"
accept="image/*"
/>

<input
type="file"
id="videoInput"
accept="video/*"
/>

<button id="photoBtn">
Upload Photo
</button>

<button
class="videoBtn"
id="videoBtn"
>
Upload Video
</button>

</div>

<div
class="gallery"
id="gallery"
></div>

<script>

const SUPABASE_URL =
"https://zapztkpavvtslvmjzxbh.supabase.co"

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InphcHp0a3BhdnZ0c2x2bWp6eGJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0Mjg2MzQsImV4cCI6MjA4OTAwNDYzNH0.81y2QP0GKLQJBkgjZkrjEhfEV_2OhJxaxpK1NfwDHRg"

const client =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
)

const params =
new URLSearchParams(window.location.search)

const jobId =
params.get("job")

if(!jobId){

alert("Missing job ID")

throw new Error("No job ID")

}

document.getElementById("jobInfo").innerText =
"Gallery for Job #" + jobId

const gallery =
document.getElementById("gallery")

const photoInput =
document.getElementById("photoInput")

const videoInput =
document.getElementById("videoInput")

const username =
localStorage.getItem("chatUser")
||
("User-" + Math.floor(Math.random()*9999))

document
.getElementById("photoBtn")
.addEventListener(
"click",
()=>{
photoInput.click()
}
)

document
.getElementById("videoBtn")
.addEventListener(
"click",
()=>{
videoInput.click()
}
)

photoInput.addEventListener(
"change",
async (e)=>{

const file =
e.target.files[0]

if(!file) return

uploadMedia(file,"photo")

}
)

videoInput.addEventListener(
"change",
async (e)=>{

const file =
e.target.files[0]

if(!file) return

uploadMedia(file,"video")

}
)

async function uploadMedia(file,type){

const fileName =
Date.now() + "-" + file.name

const { error: uploadError } =
await client.storage
.from("job-gallery")
.upload(fileName,file)

if(uploadError){

alert(uploadError.message)

return

}

const { data } =
client.storage
.from("job-gallery")
.getPublicUrl(fileName)

const mediaUrl =
data.publicUrl

const { error } =
await client
.from("job_media")
.insert([
{
job_id:jobId,
username:username,
type:type,
url:mediaUrl
}
])

if(error){

alert(error.message)

return

}

}

function renderMedia(item){

const div =
document.createElement("div")

div.className = "card"

let mediaHTML = ""

if(item.type === "photo"){

mediaHTML = `
<img src="${item.url}" />
`

}else{

mediaHTML = `
<video
controls
src="${item.url}">
</video>
`

}

div.innerHTML = `
${mediaHTML}

<div class="info">

<div class="username">
${item.username}
</div>

<div class="time">
${new Date(item.created_at)
.toLocaleString()}
</div>

</div>
`

gallery.prepend(div)

}

async function loadGallery(){

const { data,error } =
await client
.from("job_media")
.select("*")
.eq("job_id",jobId)
.order("created_at",{ ascending:true })

if(error){

console.error(error)

return

}

gallery.innerHTML = ""

if(!data.length){

gallery.innerHTML = `
<div class="empty">
No uploads yet
</div>
`

return

}

data.forEach(renderMedia)

}

client
.channel("gallery-" + jobId)
.on(
"postgres_changes",
{
event:"INSERT",
schema:"public",
table:"job_media"
},
(payload)=>{

if(
String(payload.new.job_id)
!== String(jobId)
) return

renderMedia(payload.new)

}
)
.subscribe()

loadGallery()

</script>

</body>
</html>
